[config]

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk4colors.css'
output_path = '~/.config/gtk-4.0/colors.css'

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk3colors.css'
output_path = '~/.config/gtk-3.0/colors.css'

#[templates.niri]
#input_path = '~/.config/matugen/templates/colors.kdl'
#output_path = '~/.config/niri/colors.kdl'

[templates.btop]
input_path = '~/.config/matugen/templates/btop.theme'
output_path = '~/.config/btop/themes/matugen.theme'

#[templates.konsole]
#input_path = '~/.config/matugen/templates/MatugenWarna.colorscheme'
#output_path = '~/.local/share/konsole/MatugenWarna.colorscheme'

#[templates.waybar]
#input_path = '~/.config/matugen/templates/waybar.css'
#output_path = '~/.config/waybar/colorsmatugen.css'
#post_hook = 'pkill -SIGUSR2 waybar'

[templates.rofi]
input_path = '~/.config/matugen/templates/rofi-colors.rasi'
output_path = '~/.config/rofi/rofi-colors.rasi'

[templates.foot]
input_path = '~/.config/matugen/templates/footcolors.ini'
output_path = '~/.config/foot/colors.ini'

#[templates.orbit]
#input_path = '~/.config/matugen/templates/orbittheme.toml'
#output_path = '~/.config/orbit/theme.toml'
#post_hook = 'orbit reload-theme'

[templates.cava]
input_path = '~/.config/matugen/templates/cava-colors.ini'
output_path = '~/.config/cava/themes/matugen'

[templates.nvim]
input_path = '~/.config/matugen/templates/nvim-colors.json'
output_path = '~/.config/nvim/themes/nvim-colors.json'
post_hook = "pkill -SIGUSR1 nvim"

[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland-colors.lua'
output_path = '~/.config/hypr/matugencolor.lua'
post_hook = "hyprctl reload"

[templates.quickshell]
input_path = '~/.config/matugen/templates/quickshell-colors.qml'
output_path = '~/.config/quickshell/ricegueh/matugen-colors.qml'
post_hook = 'quickshell ipc -c ricegueh call ricegueh reload'

[templates.kvantum]
input_path = '~/.config/matugen/templates/kvantum-colors.kvconfig'
output_path = '~/.config/Kvantum/matugen/matugen.kvconfig'

[templates.kvantum_svg]
input_path = '~/.config/matugen/templates/kvantum-colors.svg'
output_path = '~/.config/Kvantum/matugen/matugen.svg'
